name: PANO
options:
  bundleIdPrefix: com.ruzname
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PANO:
    type: application
    platform: iOS
    sources:
      - path: PANO/Shared
      - path: PANO/iOS
      - path: PANO/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: PANO/Resources/city-links.json
        buildPhase: resources
      - path: PANO/Resources/local-stations.json
        buildPhase: resources
      - path: PANO/Resources/districts.json
        buildPhase: resources
      - path: PANO/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruzname.pano
        PRODUCT_NAME: PANO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: PANO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Bugün ekranında günün takvim etkinliklerini göstermek için.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Yerel sekmesinde bulunduğun il ve ilçenin haberlerini göstermek için.
    info:
      path: PANO/iOS/Info.plist
      properties:
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.ruzname.pano.refresh]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen:
          UIColorName: SplashBackground
          UIImageName: SplashLogo
          UIImageRespectsSafeAreaInsets: false
